version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: polylisting-backend
    restart: unless-stopped
    environment:
      PL_DATA_DIR: /app/data
      PL_DATABASE_URL: sqlite:////app/data/polylisting.db
      PL_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      # 运行环境：production 时 PL_API_TOKEN 必须设置（未设置将拒绝启动）
      PL_ENV: ${PL_ENV:-development}
      # API 访问令牌：生产必须设置为强随机值，前端需携带同一令牌
      PL_API_TOKEN: ${PL_API_TOKEN:-}
      PL_TEXT_API_BASE: ${PL_TEXT_API_BASE:-}
      PL_TEXT_API_KEY: ${PL_TEXT_API_KEY:-}
      PL_TEXT_MODEL: ${PL_TEXT_MODEL:-gpt-4o-mini}
      PL_TEXT_JSON_MODE: ${PL_TEXT_JSON_MODE:-json_object}
      PL_IMAGE_API_BASE: ${PL_IMAGE_API_BASE:-}
      PL_IMAGE_API_KEY: ${PL_IMAGE_API_KEY:-}
      PL_IMAGE_MODEL: ${PL_IMAGE_MODEL:-gpt-image-1}
      PL_UNKNOWN_COST_POLICY: ${PL_UNKNOWN_COST_POLICY:-allow}
      PL_DAILY_BUDGET_USD: ${PL_DAILY_BUDGET_USD:-10}
      PL_PER_TASK_BUDGET_USD: ${PL_PER_TASK_BUDGET_USD:-2}
      PL_TASK_TIMEOUT_SEC: ${PL_TASK_TIMEOUT_SEC:-600}
      PL_MAX_UPLOAD_MB: ${PL_MAX_UPLOAD_MB:-10}
      PL_MAX_DOWNLOAD_MB: ${PL_MAX_DOWNLOAD_MB:-20}
    volumes:
      # 持久化：数据库、商品图片、导出文件（容器重建不丢失）
      - backend_data:/app/data
    networks:
      - polylisting
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # 安全红线：禁止将 PL_API_TOKEN 作为 build-arg 传入前端构建——
      # 任何构建期内置的密钥都会被打进 JS bundle / Source Map，
      # 等同于向所有访客公开。前端令牌一律运行时由用户输入并存入 localStorage。
    container_name: polylisting-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    ports:
      - "8080:80"
    networks:
      - polylisting
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend_data:

networks:
  polylisting:
    driver: bridge
